#
# Runs the tests on Windows and Linux. On a version tag (v0.2.0), builds the release zip with its
# SHA-256 checksum and publishes a GitHub release with both files.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -I tests/test_papyrus_log_check.py -v
      - name: Example from the README
        run: python -I papyrus_log_check.py examples/Papyrus.0.log --rules examples/example-beacon.logrules.json --out out
      - name: Release zip builds
        run: python -I build_release.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the release zip and checksum
        run: python -I build_release.py --tag "$GITHUB_REF_NAME"
      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256
          --title "papyrus-log-check ${GITHUB_REF_NAME#v}"
          --notes-file build/release-notes.md
          --verify-tag
