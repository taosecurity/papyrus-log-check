#
# Runs the tests on Windows and Linux. On a version tag (v0.2.0), builds the release zip with its
# SHA-256 checksum and publishes a GitHub release with both files.
# Actions are pinned to full commit SHAs (the tag each one was at is in the comment).
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:  # GitHub's current Ubuntu runner no longer offers 3.9; Windows still tests it
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -I tests/test_papyrus_log_check.py -v
      - name: Shared test sets
        run: python -I tests/test_shared_cases.py -v
      - name: Example from the README
        run: python -I papyrus_log_check.py examples/Papyrus.0.log --rules examples/example-beacon.logrules.json --out out
      - name: Release zip builds
        run: python -I build_release.py
      - name: Keep the checksum
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sha256-${{ matrix.os }}
          path: dist/*.sha256

  same-zip:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: sha256-*
      - name: Windows and Linux built the same zip
        run: |
          cat sha256-*/*.sha256
          test "$(cat sha256-ubuntu-latest/*.sha256)" = "$(cat sha256-windows-latest/*.sha256)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, same-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the release zip and checksum
        run: python -I build_release.py --tag "$GITHUB_REF_NAME"
      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Publish the GitHub release (safe to rerun, never replaces a file)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="papyrus-log-check ${GITHUB_REF_NAME#v}"
          if out=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>&1); then
            have=0; missing=0
            for f in dist/*; do
              if printf '%s\n' "$out" | grep -qxF "$(basename "$f")"; then have=$((have+1)); else missing=$((missing+1)); fi
            done
            if [ "$missing" -gt 0 ] && [ "$have" -gt 0 ]; then
              echo "The release has $have of the files and lacks $missing. Fix it by hand; a rerun never replaces a published file."; exit 1
            fi
            if [ "$missing" -gt 0 ]; then   # an earlier run made the release, then failed: upload everything, checksums last
              gh release upload "$GITHUB_REF_NAME" $(ls dist/* | grep -v '\.sha256$')
              gh release upload "$GITHUB_REF_NAME" dist/*.sha256
            fi
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file build/release-notes.md --draft=false
          elif printf '%s' "$out" | grep -q 'release not found'; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$title" --notes-file build/release-notes.md --verify-tag
          else
            echo "gh release view failed: $out"; exit 1
          fi
